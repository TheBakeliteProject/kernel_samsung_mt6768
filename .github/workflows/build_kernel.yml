name: Build The Bakelite Project Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build for (all, or unified [EXPERIMENTAL])'
        required: true
        default: 'a32'
        type: choice
        options:
          - a32
          - a22
          - f22
          - m22
          - m32
          - all
          - unified
      ksu:
        description: 'Add KernelSU?'
        required: true
        default: false
        type: boolean
      sched_bore:
        description: 'Enable BORE scheduler tuning? [EXPERIMENTAL]'
        required: true
        default: true
        type: boolean
      opt:
        description: 'Compiler optimization level'
        required: true
        default: 'O3'
        type: choice
        options:
          - O2
          - O3
      droidspaces:
        description: 'Enable full DroidSpaces container support?'
        required: true
        default: true
        type: boolean
      nomount:
        description: 'Enable NoMount VFS path redirection?'
        required: true
        default: true
        type: boolean
      gpu_drv:
        description: 'Mali DDK version (or all)'
        required: true
        default: 'r32p1'
        type: choice
        options:
          - r25p0
          - r32p1
          - r49p1
          - all
      zen:
        description: 'Use Zen I/O scheduler as default?'
        required: true
        default: false
        type: boolean
      aio_opt:
        description: 'Enable AIO completion optimizations?'
        required: true
        default: true
        type: boolean
      wireguard:
        description: 'Add in-kernel WireGuard support?'
        required: true
        default: false
        type: boolean
      nosec:
        description: 'Strip Samsung security layer? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      nodebug:
        description: 'Strip DEBUG configs? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      use_cache:
        description: 'Reuse last out/ cache? [EXPERIMENT]'
        required: true
        default: false
        type: boolean
      bypass_charging:
        description: 'Enable bypass charging?'
        required: true
        default: false
        type: boolean
      dynamic_fsync:
        description: 'Enable Boeffla-style dynamic fsync? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      burnin:
        description: 'Enable burn-in protection profile? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      simple_gpu:
        description: 'Enable Simple GPU Algorithm for Mali? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      mali_boost:
        description: 'Enable AdrenoBoost-style Mali touch boost? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      mtk_bus_boost:
        description: 'Enable MediaTek bus devfreq boost? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      fast_charge:
        description: 'Prefer high-current PD and 9V QC/AFC? [EXPERIMENTAL]'
        required: true
        default: false
        type: boolean
      experimental_features:
        description: 'Comma list, no spaces: sched_tuning,audio_jack_ir,bt_hci_snoop,bt_audio_transport,wowlan_keepalive,boot_diagnostics [EXPERIMENTAL]'
        required: false
        default: ''
        type: string
      clock:
        description: 'CPU clock mode [EXPERIMENT]'
        required: true
        default: 'stock'
        type: choice
        options:
          - stock
          - overclock
          - downclock
      hz:
        description: 'Tick rate (HZ) [EXPERIMENT]'
        required: true
        default: '250'
        type: choice
        options:
          - '100'
          - '250'
          - '300'
          - '1000'
      gpu_clock:
        description: 'GPU clock mode [EXPERIMENT]'
        required: true
        default: 'stock'
        type: choice
        options:
          - stock
          - overclock
          - downclock
          - max

permissions:
  contents: write

jobs:
  setup:
    name: Resolve devices
    runs-on: ubuntu-latest
    env:
      EXPERIMENTAL_FEATURES: ${{ inputs.experimental_features }}
    outputs:
      devices: ${{ steps.set.outputs.devices }}
      gpus: ${{ steps.set.outputs.gpus }}
    steps:
      - id: set
        run: |
          IFS=',' read -ra EXTRA_FLAGS <<< "$EXPERIMENTAL_FEATURES"
          for FLAG in "${EXTRA_FLAGS[@]}"; do
            case "$FLAG" in
              ''|sched_tuning|audio_jack_ir|bt_hci_snoop|bt_audio_transport|wowlan_keepalive|boot_diagnostics) ;;
              *) echo "Unknown experimental feature: $FLAG"; exit 1 ;;
            esac
          done
          if [ "${{ inputs.device }}" = "unified" ]; then
            echo 'devices=["unified"]' >> $GITHUB_OUTPUT
          elif [ "${{ inputs.device }}" = "all" ]; then
            echo 'devices=["a32", "a22", "f22", "m22", "m32"]' >> $GITHUB_OUTPUT
          else
            echo "devices=[\"${{ inputs.device }}\"]" >> $GITHUB_OUTPUT
          fi
          if [ "${{ inputs.gpu_drv }}" = "all" ]; then
            echo 'gpus=["r25p0", "r32p1", "r49p1"]' >> $GITHUB_OUTPUT
          else
            echo "gpus=[\"${{ inputs.gpu_drv }}\"]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Kernel ${{ matrix.device }} ${{ matrix.gpu }} ${{ inputs.opt }} ${{ inputs.ksu && 'with KernelSU' || 'standard' }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.devices) }}
        gpu: ${{ fromJSON(needs.setup.outputs.gpus) }}

    env:
      DEVICE_CHOICE: ${{ matrix.device }}
      GPU_CHOICE: ${{ matrix.gpu }}
      KSU_CHOICE: ${{ inputs.ksu }}
      EXPERIMENTAL_FEATURES: ${{ inputs.experimental_features }}

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex patch pkg-config git curl tar xz-utils zip unzip \
            cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole lld \
            libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler adb fastboot

      - name: Download Toolchain (ZyC Clang 14)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -Ls https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz -o Clang-14.0.6-20250704.tar.gz
          tar -xf Clang-14.0.6-20250704.tar.gz -C $GITHUB_WORKSPACE/clang
          rm Clang-14.0.6-20250704.tar.gz

      - name: Restore out cache
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: out
          key: out-${{ github.sha }}-${{ matrix.device }}-${{ inputs.opt }}-${{ inputs.ksu }}-${{ matrix.gpu }}-${{ inputs.zen }}-${{ inputs.aio_opt }}-${{ inputs.wireguard }}-${{ inputs.nosec }}-${{ inputs.nodebug }}-${{ inputs.droidspaces }}-${{ inputs.nomount }}-${{ inputs.bypass_charging }}-${{ inputs.dynamic_fsync }}-${{ inputs.burnin }}-${{ inputs.simple_gpu }}-${{ inputs.mali_boost }}-${{ inputs.mtk_bus_boost }}-${{ inputs.fast_charge }}-${{ contains(inputs.experimental_features, 'sched_tuning') }}-${{ contains(inputs.experimental_features, 'audio_jack_ir') }}-${{ contains(inputs.experimental_features, 'bt_hci_snoop') }}-${{ contains(inputs.experimental_features, 'bt_audio_transport') }}-${{ contains(inputs.experimental_features, 'wowlan_keepalive') }}-${{ contains(inputs.experimental_features, 'boot_diagnostics') }}-${{ inputs.clock }}-${{ inputs.hz }}-${{ inputs.gpu_clock }}-${{ inputs.sched_bore }}

      - name: Setup KernelSU
        if: ${{ inputs.ksu }}
        run: |
          KSU_REVISION=$(cat .github/kernelsu-revision)
          echo "Setting up ReSukiSU at $KSU_REVISION"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$KSU_REVISION"
          echo "CONFIG_KSU=y" > $GITHUB_WORKSPACE/arch/arm64/configs/ksu.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/ksu.config
          echo "# CONFIG_KSU_SUSFS is not set" >> $GITHUB_WORKSPACE/arch/arm64/configs/ksu.config

      - name: Setup WireGuard
        if: ${{ inputs.wireguard }}
        run: |
          git clone --depth 1 https://github.com/WireGuard/wireguard-linux-compat.git
          ./wireguard-linux-compat/kernel-tree-scripts/jury-rig.sh $(pwd)
          # This tree backported __kernel_timespec-as-macro from 5.x, so the
          # compat <4.18 struct redefinition collides; skip it when present.
          perl -0pi -e 's/#if LINUX_VERSION_CODE < KERNEL_VERSION\(4, 18, 0\)\nstruct __kernel_timespec \{/#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 18, 0) \&\& !defined(__kernel_timespec)\nstruct __kernel_timespec {/' net/wireguard/compat/compat.h
          grep -n "__kernel_timespec" net/wireguard/compat/compat.h | head
          # This tree also backported skb_reset_redirect into skbuff.h, so the
          # compat <5.5.14/<5.4.29 definition collides; drop the compat copy.
          perl -pi -e 's/^#if \(LINUX_VERSION_CODE < KERNEL_VERSION\(5, 5, 14\).*$/#if 0 \/* tree provides skb_reset_redirect *\//' net/wireguard/compat/compat.h
          grep -q '^#if 0 /\* tree provides skb_reset_redirect' net/wireguard/compat/compat.h || { echo 'skb_reset_redirect compat patch did not apply'; exit 1; }
          grep -q 'KERNEL_VERSION(5, 5, 14)' net/wireguard/compat/compat.h && { echo 'skb_reset_redirect compat guard still present'; exit 1; }
          grep -n "skb_reset_redirect" net/wireguard/compat/compat.h | head

      - name: Compile Kernel
        run: |
          if [ "${{ inputs.use_cache }}" != "true" ]; then
            rm -rf out
            make clean 2>/dev/null || true
            make mrproper 2>/dev/null || true
          else
            echo "use_cache: keeping previous out/ for incremental build"
          fi
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          export TC=$GITHUB_WORKSPACE/clang
          export CROSS_COMPILE=$TC/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$TC/bin/arm-linux-gnueabi-
          export LD=$TC/bin/ld.lld
          export CC=$TC/bin/clang
          export ARCH=arm64
          export KCFLAGS=" -w -pipe -${{ inputs.opt }}"
          export KCPPFLAGS=" -${{ inputs.opt }}"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export CFGDIR=arch/arm64/configs
          has_feature() {
            case ",$EXPERIMENTAL_FEATURES," in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }
          rm -f $CFGDIR/compiled_defconfig
          if [ "${{ env.DEVICE_CHOICE }}" = "unified" ]; then
            echo "Unified build: merging all 5 device configs (experimental; bool flags union, strings last-wins)"
            cat $CFGDIR/mt6768_bakelite_defconfig \
              $CFGDIR/a32.config $CFGDIR/a22.config $CFGDIR/f22.config \
              $CFGDIR/m22.config $CFGDIR/m32.config > $CFGDIR/compiled_defconfig
            # Union the imsensor list so every model's sensors are compiled in.
            # Per-slot SENSOR0-4 / PROJECT / CMDLINE stay last-wins (m32) — known limitation.
            SENSOR_LIST=$(grep -h '^CONFIG_CUSTOM_KERNEL_IMGSENSOR=' $CFGDIR/a32.config $CFGDIR/a22.config $CFGDIR/f22.config $CFGDIR/m22.config $CFGDIR/m32.config | sed 's/^CONFIG_CUSTOM_KERNEL_IMGSENSOR="//;s/"$//' | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ' | sed 's/ $//')
            scripts/config --file $CFGDIR/compiled_defconfig --set-str CONFIG_CUSTOM_KERNEL_IMGSENSOR "$SENSOR_LIST"
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_CAMERA_AAU_V32 \
              --enable CONFIG_CAMERA_AAU_V22 \
              --enable CONFIG_CAMERA_MMU_V22 \
              --enable CONFIG_CAMERA_MMU_V32 \
              --enable CONFIG_SMCDSD_PANEL_A32 \
              --enable CONFIG_SMCDSD_PANEL_A22 \
              --enable CONFIG_SMCDSD_PANEL_M22 \
              --enable CONFIG_SMCDSD_PANEL_M32
          else
            cat $CFGDIR/mt6768_bakelite_defconfig $CFGDIR/${{ env.DEVICE_CHOICE }}.config > $CFGDIR/compiled_defconfig
          fi
          scripts/config --file $CFGDIR/compiled_defconfig \
            --enable CONFIG_CPU_FREQ_GOV_BAKELITE \
            --enable CONFIG_CPU_FREQ_DEFAULT_GOV_BAKELITEBALANCE \
            --disable CONFIG_CPU_FREQ_DEFAULT_GOV_BAKELITEPERF \
            --disable CONFIG_CPU_FREQ_DEFAULT_GOV_BAKELITEBATTERY \
            --enable CONFIG_TCP_CONG_BBR2 \
            --disable CONFIG_DEFAULT_BIC \
            --enable CONFIG_DEFAULT_BBR2
          if [ "${{ inputs.sched_bore }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_SCHED_BORE
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_SCHED_BORE
          fi
          if [ "${{ inputs.ksu }}" = "true" ]; then
            cat $CFGDIR/ksu.config >> $CFGDIR/compiled_defconfig
          fi
          if [ "${{ inputs.nomount }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_NOMOUNT
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_NOMOUNT
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_SYSCTL \
              --enable CONFIG_SYSVIPC \
              --enable CONFIG_POSIX_MQUEUE \
              --enable CONFIG_NAMESPACES \
              --enable CONFIG_PID_NS \
              --enable CONFIG_UTS_NS \
              --enable CONFIG_IPC_NS \
              --enable CONFIG_USER_NS \
              --enable CONFIG_SECCOMP \
              --enable CONFIG_SECCOMP_FILTER \
              --enable CONFIG_CGROUPS \
              --enable CONFIG_CGROUP_DEVICE \
              --enable CONFIG_CGROUP_PIDS \
              --enable CONFIG_MEMCG \
              --enable CONFIG_CGROUP_SCHED \
              --enable CONFIG_FAIR_GROUP_SCHED \
              --enable CONFIG_CGROUP_FREEZER \
              --enable CONFIG_CGROUP_NET_PRIO \
              --enable CONFIG_DEVTMPFS \
              --enable CONFIG_OVERLAY_FS \
              --enable CONFIG_TMPFS_POSIX_ACL \
              --enable CONFIG_TMPFS_XATTR \
              --enable CONFIG_FW_LOADER \
              --enable CONFIG_FW_LOADER_USER_HELPER_FALLBACK \
              --enable CONFIG_FW_LOADER_USER_HELPER \
              --enable CONFIG_NET_NS \
              --enable CONFIG_VETH \
              --enable CONFIG_BRIDGE \
              --enable CONFIG_NETFILTER \
              --enable CONFIG_BRIDGE_NETFILTER \
              --enable CONFIG_NETFILTER_ADVANCED \
              --enable CONFIG_NF_CONNTRACK \
              --enable CONFIG_IP_NF_IPTABLES \
              --enable CONFIG_IP_NF_FILTER \
              --enable CONFIG_NF_NAT \
              --enable CONFIG_NF_TABLES \
              --enable CONFIG_NF_NAT_MASQUERADE_IPV4 \
              --enable CONFIG_IP_NF_TARGET_MASQUERADE \
              --enable CONFIG_NETFILTER_XT_TARGET_TCPMSS \
              --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
              --enable CONFIG_NF_CT_NETLINK \
              --enable CONFIG_NF_NAT_REDIRECT \
              --enable CONFIG_IP_ADVANCED_ROUTER \
              --enable CONFIG_IP_MULTIPLE_TABLES \
              --enable CONFIG_NF_CONNTRACK_IPV4 \
              --enable CONFIG_NF_NAT_IPV4 \
              --enable CONFIG_IP_NF_NAT
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_SYSVIPC \
              --disable CONFIG_POSIX_MQUEUE \
              --disable CONFIG_IPC_NS \
              --disable CONFIG_USER_NS \
              --disable CONFIG_CGROUP_NET_PRIO \
              --disable CONFIG_DEVTMPFS \
              --disable CONFIG_TMPFS_POSIX_ACL \
              --disable CONFIG_TMPFS_XATTR \
              --disable CONFIG_NF_TABLES \
              --disable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          fi
          scripts/config --file $CFGDIR/compiled_defconfig \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_THINLTO \
            --enable CONFIG_LTO_NONE
          if [ "${{ inputs.zen }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_IOSCHED_ZEN \
              --enable CONFIG_DEFAULT_ZEN
          fi
          if [ "${{ inputs.aio_opt }}" != "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_AIO_OPTIMIZE
          fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_WIREGUARD \
              --enable CONFIG_NET_UDP_TUNNEL \
              --enable CONFIG_DST_CACHE \
              --enable CONFIG_CRYPTO_ALGAPI
          fi
          if [ "${{ inputs.nosec }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_TZDEV \
              --disable CONFIG_TEEGRIS_TEE_SUPPORT
          fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_DYNAMIC_DEBUG \
              --disable CONFIG_DEBUG_INFO \
              --disable CONFIG_SCHED_DEBUG \
              --disable CONFIG_DEBUG_LIST \
              --disable CONFIG_FTRACE \
              --disable CONFIG_MAGIC_SYSRQ \
              --disable CONFIG_KALLSYMS_ALL
          fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_MTK_BYPASS_CHARGING
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_MTK_BYPASS_CHARGING
          fi
          if [ "${{ inputs.dynamic_fsync }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_DYNAMIC_FSYNC
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_DYNAMIC_FSYNC
          fi
          if [ "${{ inputs.burnin }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_BAKELITE_BURNIN_PROTECTION
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_BAKELITE_BURNIN_PROTECTION
          fi
          if [ "${{ inputs.simple_gpu }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_MTK_SIMPLE_GPU_ALGORITHM
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_SIMPLE_GPU_ALGORITHM
          fi
          if [ "${{ inputs.mali_boost }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_MTK_MALI_BOOST
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_MALI_BOOST
          fi
          if [ "${{ inputs.mtk_bus_boost }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_MTK_DEVFREQ_BUS_BOOST
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_DEVFREQ_BUS_BOOST
          fi
          if has_feature sched_tuning; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_BAKELITE_SCHED_TUNING
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_BAKELITE_SCHED_TUNING
          fi
          if [ "${{ inputs.fast_charge }}" = "true" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_BAKELITE_FAST_CHARGE_PROFILE
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_BAKELITE_FAST_CHARGE_PROFILE
          fi
          if has_feature bt_hci_snoop; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_FTRACE \
              --enable CONFIG_TRACING \
              --enable CONFIG_MTK_BT_HCI_TRACE
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_BT_HCI_TRACE
          fi
          if has_feature bt_audio_transport; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_MTK_BT_AUDIO_TRANSPORT
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_BT_AUDIO_TRANSPORT
          fi
          if has_feature wowlan_keepalive; then
            scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_MTK_WLAN_WOWLAN_KEEPALIVE
          else
            scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_MTK_WLAN_WOWLAN_KEEPALIVE
          fi
          if [ "${{ inputs.clock }}" = "overclock" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_BAKELITE_OC_GPU \
              --enable CONFIG_BAKELITE_OC_CCI \
              --enable CONFIG_BAKELITE_OC_RAMDVFS \
              --disable CONFIG_BAKELITE_UV
          elif [ "${{ inputs.clock }}" = "downclock" ]; then
            scripts/config --file $CFGDIR/compiled_defconfig \
              --enable CONFIG_BAKELITE_UV \
              --disable CONFIG_BAKELITE_OC_GPU \
              --disable CONFIG_BAKELITE_OC_CCI \
              --disable CONFIG_BAKELITE_OC_RAMDVFS
          else
            scripts/config --file $CFGDIR/compiled_defconfig \
              --disable CONFIG_BAKELITE_OC_GPU \
              --disable CONFIG_BAKELITE_OC_CCI \
              --disable CONFIG_BAKELITE_OC_RAMDVFS \
              --disable CONFIG_BAKELITE_UV
          fi
          case "${{ inputs.hz }}" in
            100) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_300 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 100 ;;
            250) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_250 --disable CONFIG_HZ_100 --disable CONFIG_HZ_300 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 250 ;;
            300) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_300 --disable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_1000 --set-val CONFIG_HZ 300 ;;
            1000) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_HZ_1000 --disable CONFIG_HZ_100 --disable CONFIG_HZ_250 --disable CONFIG_HZ_300 --set-val CONFIG_HZ 1000 ;;
          esac
          case "${{ inputs.gpu_clock }}" in
            overclock) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_BAKELITE_OC_GPU ;;
            downclock) scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_BAKELITE_OC_GPU ;;
            max) scripts/config --file $CFGDIR/compiled_defconfig --enable CONFIG_BAKELITE_OC_GPU --enable CONFIG_BAKELITE_OC_CCI --enable CONFIG_BAKELITE_OC_RAMDVFS ;;
            *) scripts/config --file $CFGDIR/compiled_defconfig --disable CONFIG_BAKELITE_OC_GPU ;;
          esac
          echo '' >> $CFGDIR/compiled_defconfig
          echo '# CONFIG_ALWAYS_ENFORCE is not set' >> $CFGDIR/compiled_defconfig
          echo 'CONFIG_ALWAYS_PERMISSIVE=y' >> $CFGDIR/compiled_defconfig
          case "${{ env.GPU_CHOICE }}" in
            r25p0) GPU_STR='mali bifrost r25p0' ;;
            r49p1) GPU_STR='mali avalon r49p1' ;;
            *) GPU_STR='mali valhall r32p1' ;;
          esac
          echo "GPU driver: $GPU_STR"
          echo "CONFIG_MTK_GPU_VERSION=\"$GPU_STR\"" >> $CFGDIR/compiled_defconfig
          make -C $(pwd) O=$(pwd)/out -j$(nproc) compiled_defconfig
          require_config() {
            if ! grep -Fqx "$1=y" out/.config; then
              echo "Requested kernel feature $1 is unavailable for this configuration"
              exit 1
            fi
          }
          grep -Fqx "CONFIG_MTK_GPU_VERSION=\"$GPU_STR\"" out/.config || {
            echo "Mali $GPU_STR was not selected"
            exit 1
          }
          require_config CONFIG_CPU_FREQ_GOV_BAKELITE
          require_config CONFIG_CPU_FREQ_DEFAULT_GOV_BAKELITEBALANCE
          require_config CONFIG_TCP_CONG_BBR2
          require_config CONFIG_DEFAULT_BBR2
          grep -Fqx 'CONFIG_DEFAULT_TCP_CONG="bbr2"' out/.config || {
            echo 'BBRv2 was not selected as the default TCP congestion control'
            exit 1
          }
          require_config CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          require_config CONFIG_IMG_GZ_DTB
          if [ "${{ inputs.sched_bore }}" = "true" ]; then
            require_config CONFIG_SCHED_BORE
          elif ! grep -Fqx '# CONFIG_SCHED_BORE is not set' out/.config; then
            echo 'BORE scheduler was not disabled'
            exit 1
          fi
          if [ "${{ inputs.ksu }}" = "true" ] && grep -Fqx 'CONFIG_KSU_SUSFS=y' out/.config; then
            echo 'SUSFS inline hook mode must be disabled'
            exit 1
          fi
          if [ "${{ inputs.nomount }}" = "true" ]; then
            require_config CONFIG_NOMOUNT
          elif ! grep -Fqx '# CONFIG_NOMOUNT is not set' out/.config; then
            echo 'NoMount was not disabled'
            exit 1
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            for config in \
              CONFIG_SYSCTL CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE \
              CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS \
              CONFIG_USER_NS CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
              CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS \
              CONFIG_MEMCG CONFIG_CGROUP_SCHED CONFIG_FAIR_GROUP_SCHED \
              CONFIG_CGROUP_FREEZER CONFIG_CGROUP_NET_PRIO CONFIG_DEVTMPFS \
              CONFIG_OVERLAY_FS CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR \
              CONFIG_FW_LOADER CONFIG_FW_LOADER_USER_HELPER_FALLBACK \
              CONFIG_FW_LOADER_USER_HELPER CONFIG_NET_NS \
              CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER \
              CONFIG_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK \
              CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_FILTER CONFIG_NF_NAT \
              CONFIG_NF_TABLES CONFIG_NF_NAT_MASQUERADE_IPV4 \
              CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_NETFILTER_XT_TARGET_TCPMSS \
              CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NF_CT_NETLINK \
              CONFIG_NF_NAT_REDIRECT CONFIG_IP_ADVANCED_ROUTER \
              CONFIG_IP_MULTIPLE_TABLES CONFIG_NF_CONNTRACK_IPV4 \
              CONFIG_NF_NAT_IPV4 CONFIG_IP_NF_NAT; do
              require_config "$config"
            done
            if grep -Fqx 'CONFIG_ANDROID_PARANOID_NETWORK=y' out/.config; then
              echo 'Android paranoid networking must be disabled for DroidSpaces'
              exit 1
            fi
          fi
          if [ "${{ inputs.dynamic_fsync }}" = "true" ]; then require_config CONFIG_DYNAMIC_FSYNC; fi
          if [ "${{ inputs.burnin }}" = "true" ]; then require_config CONFIG_BAKELITE_BURNIN_PROTECTION; fi
          if [ "${{ inputs.simple_gpu }}" = "true" ]; then require_config CONFIG_MTK_SIMPLE_GPU_ALGORITHM; fi
          if [ "${{ inputs.mali_boost }}" = "true" ]; then require_config CONFIG_MTK_MALI_BOOST; fi
          if [ "${{ inputs.mtk_bus_boost }}" = "true" ]; then require_config CONFIG_MTK_DEVFREQ_BUS_BOOST; fi
          if has_feature sched_tuning; then require_config CONFIG_BAKELITE_SCHED_TUNING; fi
          if [ "${{ inputs.fast_charge }}" = "true" ]; then require_config CONFIG_BAKELITE_FAST_CHARGE_PROFILE; fi
          if has_feature bt_hci_snoop; then require_config CONFIG_MTK_BT_HCI_TRACE; fi
          if has_feature bt_audio_transport; then require_config CONFIG_MTK_BT_AUDIO_TRANSPORT; fi
          if has_feature wowlan_keepalive; then require_config CONFIG_MTK_WLAN_WOWLAN_KEEPALIVE; fi
          make -s -C $(pwd) O=$(pwd)/out -j$(nproc)

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/stardustps/sta7dust.git sta7dust
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Appended DTB kernel image not found!"
            exit 1
          fi
          cp out/arch/arm64/boot/Image.gz-dtb sta7dust/

      - name: Package audio-jack IR tool
        run: |
          case ",$EXPERIMENTAL_FEATURES," in
            *,audio_jack_ir,*)
              mkdir -p sta7dust/extras
              cp tools/bakelite/audio_jack_ir.py sta7dust/extras/
              ;;
          esac

      - name: Package boot diagnostics tool
        run: |
          case ",$EXPERIMENTAL_FEATURES," in
            *,boot_diagnostics,*)
              mkdir -p sta7dust/extras/bakelite-diagnostics
              cp tools/bakelite/collect_boot_diagnostics.sh sta7dust/extras/bakelite-diagnostics/
              printf 'device=%s\nclock=%s\nhz=%s\ngpu_clock=%s\nsched_bore=%s\nexperimental_features=%s\n' \
                "${{ env.DEVICE_CHOICE }}" "${{ inputs.clock }}" "${{ inputs.hz }}" "${{ inputs.gpu_clock }}" "${{ inputs.sched_bore }}" "$EXPERIMENTAL_FEATURES" \
                > sta7dust/extras/bakelite-diagnostics/features.txt
              ;;
          esac

      - name: Create Flashable Zip
        run: |
          cd sta7dust
          has_feature() {
            case ",$EXPERIMENTAL_FEATURES," in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }
          SUFFIX="${{ inputs.opt }}"
          if [ "${{ env.DEVICE_CHOICE }}" = "unified" ]; then
            SUFFIX="$SUFFIX-unified"
          fi
          if [ "${{ inputs.sched_bore }}" = "true" ]; then
            SUFFIX="$SUFFIX-bore"
          fi
          if [ "${{ inputs.ksu }}" = "true" ]; then
            SUFFIX="$SUFFIX-ksu"
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            SUFFIX="$SUFFIX-ds"
          fi
          if [ "${{ inputs.nomount }}" = "true" ]; then
            SUFFIX="$SUFFIX-nm"
          fi
          if [ "${{ inputs.zen }}" = "true" ]; then
            SUFFIX="$SUFFIX-zen"
          fi
          if [ "${{ inputs.aio_opt }}" != "true" ]; then
            SUFFIX="$SUFFIX-noaioopt"
          fi
          if [ "${{ inputs.use_cache }}" = "true" ]; then
            SUFFIX="$SUFFIX-cache"
          fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then
            SUFFIX="$SUFFIX-bypass"
          fi
          if [ "${{ inputs.dynamic_fsync }}" = "true" ]; then
            SUFFIX="$SUFFIX-dfsync"
          fi
          if [ "${{ inputs.burnin }}" = "true" ]; then
            SUFFIX="$SUFFIX-burnin"
          fi
          if [ "${{ inputs.simple_gpu }}" = "true" ]; then
            SUFFIX="$SUFFIX-sgpu"
          fi
          if [ "${{ inputs.mali_boost }}" = "true" ]; then
            SUFFIX="$SUFFIX-mboost"
          fi
          if [ "${{ inputs.mtk_bus_boost }}" = "true" ]; then
            SUFFIX="$SUFFIX-busboost"
          fi
          if has_feature sched_tuning; then
            SUFFIX="$SUFFIX-stune"
          fi
          if [ "${{ inputs.fast_charge }}" = "true" ]; then
            SUFFIX="$SUFFIX-fastchg"
          fi
          if has_feature audio_jack_ir; then
            SUFFIX="$SUFFIX-irjack"
          fi
          if has_feature bt_hci_snoop; then
            SUFFIX="$SUFFIX-bttrace"
          fi
          if has_feature bt_audio_transport; then
            SUFFIX="$SUFFIX-btbuf"
          fi
          if has_feature wowlan_keepalive; then
            SUFFIX="$SUFFIX-wowlan"
          fi
          if has_feature boot_diagnostics; then
            SUFFIX="$SUFFIX-diagnostics"
          fi
          if [ "${{ inputs.clock }}" = "overclock" ]; then
            SUFFIX="$SUFFIX-oc"
          elif [ "${{ inputs.clock }}" = "downclock" ]; then
            SUFFIX="$SUFFIX-uv"
          fi
          SUFFIX="$SUFFIX-${{ inputs.hz }}hz"
          if [ "${{ inputs.gpu_clock }}" != "stock" ]; then
            SUFFIX="$SUFFIX-gpu${{ inputs.gpu_clock }}"
          fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then
            SUFFIX="$SUFFIX-wg"
          fi
          if [ "${{ inputs.nosec }}" = "true" ]; then
            SUFFIX="$SUFFIX-nosec"
          fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then
            SUFFIX="$SUFFIX-nodebug"
          fi
          SUFFIX="$SUFFIX-${{ env.GPU_CHOICE }}"
          zip -r9 ../bakelite-r2-Elysium-${{ env.DEVICE_CHOICE }}-$SUFFIX-${{ env.SHORT_SHA }}.zip * -x .git README.md *placeholder
          ls -lh ../bakelite-r2-Elysium-*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakelite-r2-Elysium-${{ env.DEVICE_CHOICE }}-${{ env.GPU_CHOICE }}-${{ inputs.ksu && 'ksu' || 'standard' }}
          path: bakelite-r2-Elysium-*.zip

  notify:
    name: Telegram summary
    needs: build
    runs-on: ubuntu-latest
    env:
      EXPERIMENTAL_FEATURES: ${{ inputs.experimental_features }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Send Telegram summary
        run: |
          cd builds
          has_feature() {
            case ",$EXPERIMENTAL_FEATURES," in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }
          shopt -s nullglob
          ZIPS=(bakelite-r2-Elysium-*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "error: no Bakelite zips downloaded, refusing to send an empty notification"
            exit 1
          fi
          if [ "${{ inputs.ksu }}" = "true" ]; then KSU_STATUS="yes"; else KSU_STATUS="no"; fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then DS_STATUS="yes"; else DS_STATUS="no"; fi
          if [ "${{ inputs.nomount }}" = "true" ]; then NM_STATUS="yes"; else NM_STATUS="no"; fi
          if [ "${{ inputs.zen }}" = "true" ]; then ZEN_STATUS="zen"; else ZEN_STATUS="cfq"; fi
          if [ "${{ inputs.aio_opt }}" = "true" ]; then AIO_STATUS="yes"; else AIO_STATUS="no"; fi
          if [ "${{ inputs.wireguard }}" = "true" ]; then WG_STATUS="yes"; else WG_STATUS="no"; fi
          if [ "${{ inputs.nosec }}" = "true" ]; then SEC_STATUS="stripped"; else SEC_STATUS="kept"; fi
          if [ "${{ inputs.nodebug }}" = "true" ]; then DBG_STATUS="stripped"; else DBG_STATUS="full"; fi
          if [ "${{ inputs.use_cache }}" = "true" ]; then CACHE_STATUS="yes"; else CACHE_STATUS="no"; fi
          if [ "${{ inputs.bypass_charging }}" = "true" ]; then BYPASS_STATUS="yes"; else BYPASS_STATUS="no"; fi
          if [ "${{ inputs.dynamic_fsync }}" = "true" ]; then FSYNC_STATUS="yes"; else FSYNC_STATUS="no"; fi
          if [ "${{ inputs.burnin }}" = "true" ]; then BURNIN_STATUS="yes"; else BURNIN_STATUS="no"; fi
          if [ "${{ inputs.simple_gpu }}" = "true" ]; then SGPU_STATUS="yes"; else SGPU_STATUS="no"; fi
          if [ "${{ inputs.mali_boost }}" = "true" ]; then MBOOST_STATUS="yes"; else MBOOST_STATUS="no"; fi
          if [ "${{ inputs.mtk_bus_boost }}" = "true" ]; then BUS_STATUS="yes"; else BUS_STATUS="no"; fi
          if has_feature sched_tuning; then STUNE_STATUS="yes"; else STUNE_STATUS="no"; fi
          if [ "${{ inputs.fast_charge }}" = "true" ]; then CHARGE_STATUS="yes"; else CHARGE_STATUS="no"; fi
          if has_feature audio_jack_ir; then IR_STATUS="yes"; else IR_STATUS="no"; fi
          if has_feature bt_hci_snoop; then BT_TRACE_STATUS="yes"; else BT_TRACE_STATUS="no"; fi
          if has_feature bt_audio_transport; then BT_BUF_STATUS="yes"; else BT_BUF_STATUS="no"; fi
          if has_feature wowlan_keepalive; then WOWLAN_STATUS="yes"; else WOWLAN_STATUS="no"; fi
          if has_feature boot_diagnostics; then DIAGNOSTICS_STATUS="yes"; else DIAGNOSTICS_STATUS="no"; fi
          if [ "${{ inputs.sched_bore }}" = "true" ]; then BORE_STATUS="yes"; else BORE_STATUS="no"; fi
          CLOCK_STATUS="${{ inputs.clock }}"
          HZ_STATUS="${{ inputs.hz }}"
          GPU_CLOCK_STATUS="${{ inputs.gpu_clock }}"
          LIST=""
          COUNT=0
          for ZIP in bakelite-r2-Elysium-*.zip; do
            MD5=$(md5sum "$ZIP" | cut -d ' ' -f 1)
            REST=${ZIP#bakelite-r2-Elysium-}
            DEV=${REST%%-*}
            COUNT=$((COUNT + 1))
            LIST=$(printf '%s\n- %s — md5: %s' "$LIST" "$DEV" "$MD5")
            echo "$ZIP $MD5" >> files.txt
          done
          TEXT=$(printf '<i>build successfully.</i>\n\nThe Bakelite Project kernel (%s builds)\n\nkernel version: 4.14.357\nBakelite patch version: r2-Elysium\n\ncompiler: ZyC Clang 14 -%s\nlto: %s\nkernelsu integrated: %s\ndroidspaces: %s\nnomount: %s\niosched: %s\naio optimized: %s\nwireguard: %s\nsamsung security: %s\ndebug: %s\ncache: %s\nbypass charging: %s\ndynamic fsync: %s\nburn-in profile: %s\nsimple GPU: %s\nMali boost: %s\nMTK bus boost: %s\nclock: %s\ntick: %sHz\ngpu clock: %s\ncommit: %s\n%s' "$COUNT" "${{ inputs.opt }}" "none" "$KSU_STATUS" "$DS_STATUS" "$NM_STATUS" "$ZEN_STATUS" "$AIO_STATUS" "$WG_STATUS" "$SEC_STATUS" "$DBG_STATUS" "$CACHE_STATUS" "$BYPASS_STATUS" "$FSYNC_STATUS" "$BURNIN_STATUS" "$SGPU_STATUS" "$MBOOST_STATUS" "$BUS_STATUS" "$CLOCK_STATUS" "$HZ_STATUS" "$GPU_CLOCK_STATUS" "${{ github.sha }}" "$LIST")
          TEXT=$(printf '%s\nBORE scheduler: %s\nscheduler tuning: %s\nfast-charge profile: %s\naudio-jack IR tool: %s\nBT HCI trace: %s\nBT transport buffer: %s\nWoWLAN retention: %s\nboot diagnostics: %s' "$TEXT" "$BORE_STATUS" "$STUNE_STATUS" "$CHARGE_STATUS" "$IR_STATUS" "$BT_TRACE_STATUS" "$BT_BUF_STATUS" "$WOWLAN_STATUS" "$DIAGNOSTICS_STATUS")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$TEXT"
          while read -r ZIP MD5; do
            [ -n "$ZIP" ] || continue
            CAP=$(printf '%s\nmd5: %s' "$ZIP" "$MD5")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F document=@"$ZIP" \
              -F parse_mode=HTML \
              -F caption="$CAP"
          done < files.txt
